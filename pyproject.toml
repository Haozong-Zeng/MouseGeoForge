[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mousegeoforge"
version = "0.1.0"
description = "Instance-centric mouse geometry and depth-pose research"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy", "vggt-omega"]

[tool.setuptools.packages.find]
include = ["mousegeoforge*"]
